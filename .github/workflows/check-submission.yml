name: Check world submission

on:
  pull_request:
    paths: ["submissions/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only submission files change
        run: |
          changed=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")
          echo "$changed"
          if echo "$changed" | grep -v '^submissions/[a-z0-9-]*\.json$' | grep -q .; then
            echo "::error::A world submission may only add files named submissions/<id>.json." >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the bundle each submission names
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          CATALOG_INDEX: index.json
        run: |
          git diff --name-only --diff-filter=AM "origin/${GITHUB_BASE_REF}...HEAD" -- 'submissions/*.json' > /tmp/submissions
          [ -s /tmp/submissions ] || exit 0
          # The checker is the one on main: a pull request cannot change how it is checked.
          git show "origin/${GITHUB_BASE_REF}:tools/catalog.py" > /tmp/catalog.py
          git show "origin/${GITHUB_BASE_REF}:index.json" > index.json
          xargs python /tmp/catalog.py validate --pr-author "$PR_AUTHOR" < /tmp/submissions
